[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/"
  to = "/director-tecnico.html"
  status = 301

# Fase 79: el service worker no se puede cachear en el navegador, si no un
# deploy nuevo tarda días en llegar al celular.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Fase 108: camisetas y escudos por URL, para cargarlos en otro juego
# (Dream League Soccer y otros tienen la opción de bajarlos desde una dirección).
[[redirects]]
  from = "/kit/*"
  to = "/.netlify/functions/kit/:splat"
  status = 200
