<body>
<h1>&#9917; SportDB Player Extractor v3</h1>

<div class="panel">
  <label>API Key (SportDB)</label>
  <input type="text" id="apiKey" placeholder="Pegá tu API key acá">

  </div>

  <label style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#f6d318;margin-bottom:8px"><input type="checkbox" id="deepNats" style="width:auto;margin:0"> <b>Nacionalidades desde el perfil de SportDB</b> — ⚠️ GASTA 1 CRÉDITO POR JUGADOR (~13.000). Sólo si la API libre está caída. Con el Worker actualizado quedan cacheadas y no se vuelven a pagar.</label><br>
  <button onclick="testAPI()">1. Probar conexión</button>
  <button class="secondary" onclick="discoverLeagues()">2. Descubrir ligas</button>

<div class="panel">

<script>
let API_KEY = '';
let allPlayers = [];
let allCoaches = [];
let discoveredLeagues = [];
let reqCount = 0;

const TARGET_COUNTRIES_TM = {
  'Argentina':true,'Brazil':true,'Chile':true,'Paraguay':true,
  'Uruguay':true,'Colombia':true,'Peru':true,'Ecuador':true,
  'Venezuela':true,'Bolivia':true,'Mexico':true,'USA':true,
  'United States':true,'England':true,'Spain':true,'France':true,
  'Germany':true,'Italy':true,'Netherlands':true,'Russia':true,
  'Belgium':true,'Portugal':true,'Turkey':true,
  'Türkiye':true,'Turkiye':true,'Greece':true,
  // 'Saudi' cubre "Saudi Arabia" y el alemán "Saudi-Arabien"; 'Arabia' cubre
  // "Arabia Saudita" si la fuente devuelve el país en español.
  'Saudi':true,'Arabia':true
};

function log(msg) {
  const el = document.getElementById('status');
  el.textContent = msg + '\n' + el.textContent.slice(0, 30000);
}

function setProgress(pct) {
  const bar = document.getElementById('pbar');
  bar.style.width = pct + '%';
  bar.textContent = Math.round(pct) + '%';
}

function updateStats(leagues, teams, players) {
  document.getElementById('sLeagues').textContent = leagues;
  document.getElementById('sTeams').textContent = teams;
  document.getElementById('sPlayers').textContent = players;
  document.getElementById('sReqs').textContent = reqCount;
}

function getApiChoice() {
  return document.querySelector('input[name="apiChoice"]:checked').value;
}

let cacheHits = 0;
// Workers viejos no conocen tmapi/tmcoach y devuelven 400. En vez de perder
// las nacionalidades y los DTs, se detecta una vez y a partir de ahí esas dos
// consultas van por la función de Netlify (que sí las soporta).
let workerLacksFree = false;
// La TM-API libre (tmapi) se cae seguido. Se consultaba una vez POR CLUB: con
// 500 clubes son 500 pedidos perdidos, cada uno con su espera. Se detecta la
// caída una vez y no se la vuelve a consultar en toda la corrida.
let tmapiDown = false;
async function apiGet(path, apiType) {
  apiType = apiType || getApiChoice();
  const isFree = (apiType === 'tmapi' || apiType === 'tmcoach');
  if (apiType === 'tmapi' && tmapiDown) return null;
  reqCount++;
  document.getElementById('sReqs').textContent = reqCount + (cacheHits ? ` (${cacheHits} de caché)` : '');
  let cfW = (document.getElementById('cfWorker')||{value:''}).value.trim();
  // Si ya sabemos que el Worker no soporta las fuentes libres, no lo usamos para ellas
  if (isFree && workerLacksFree) cfW = '';
  // Con Worker cacheado no hace falta frenar tanto entre requests
  if (reqCount % 3 === 0) await sleep(cfW ? 250 : 1100);
  const mkUrl = (w) => (w ? w.replace(/\/+$/,'') + '/?api=' : '/.netlify/functions/sportdb?api=')
    + apiType + '&key=' + encodeURIComponent(API_KEY) + '&path=' + encodeURIComponent(path);
  let fnUrl = mkUrl(cfW);
  for (let intento = 0; intento < 3; intento++) {
    try {
      const res = await fetch(fnUrl);
      if (res.headers.get('x-cache') === 'HIT') {
        cacheHits++;
        document.getElementById('sReqs').textContent = reqCount + ` (${cacheHits} de caché)`;
      }
      // La TM-API libre limita velocidad: en 429/503 esperamos y reintentamos
      if ((res.status === 429 || res.status === 503) && intento < 2) {
        await sleep(4000 * (intento + 1));
        continue;
      }
      // ═══ EL WORKER NO SOPORTA ESTA FUENTE: pasamos a Netlify y seguimos ═══
      if (res.status === 400 && isFree && cfW) {
        if (!workerLacksFree) {
          workerLacksFree = true;
          log('⚠️ Tu Worker de Cloudflare no soporta ' + apiType + ' (es una versión vieja).');
          log('   → Uso automático de la función de Netlify para nacionalidades y DTs.');
          log('   Para recuperar el caché, actualizá el Worker con cloudflare-worker/sportdb-cache.js');
        }
        cfW = '';
        fnUrl = mkUrl('');
        continue;               // reintento por Netlify
      }
      if (!res.ok) {
        // Sin el nombre de la fuente, un 500 de la API libre parecía un 500 del
        // plantel y daba la impresión de que no andaba nada.
        log(`ERROR ${res.status} en ${path}  (fuente: ${apiType})`);
        if (apiType === 'tmapi' && !tmapiDown) {
          tmapiDown = true;
          log('   → La API libre de nacionalidades está caída. No la consulto más en esta corrida.');
          log('   → Los planteles y los DTs NO dependen de ella: siguen andando.');
          log('   → Para tener nacionalidades, tildá "Nacionalidades desde el perfil" (1 crédito por jugador).');
        }
        return null;
      }
      return await res.json();
    } catch (e) {
      log(`FETCH ERROR: ${e.message} — ${path}`);
      return null;
    }
  }
  return null;
}
// Restaurar la URL del Worker guardada
window.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('cf_worker');
  if (saved) document.getElementById('cfWorker').value = saved;
});

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ========== TEST CONNECTION ==========
async function testAPI() {
  API_KEY = document.getElementById('apiKey').value.trim();
  if (!API_KEY) { alert('Ingresá tu API key'); return; }
  const api = getApiChoice();
  log(`Probando conexión (${api})...`);

  if (api === 'transfermarkt') {
    const countries = await apiGet('/countries', 'transfermarkt');
    if (countries) {
      log('✓ TransferMarkt conectado');
      log('Países: ' + JSON.stringify(countries).slice(0, 800));
    } else {
      log('✗ Error conectando a TransferMarkt');
    }
  } else {
    const data = await apiGet('/football', 'flashscore');
    if (data) {
      log('✓ Flashscore conectado');
      if (Array.isArray(data)) log(`${data.length} países encontrados`);
    } else {
      log('✗ Error conectando a Flashscore');
    }
  }
}

// ========== DISCOVER LEAGUES ==========
async function discoverLeagues() {
  API_KEY = document.getElementById('apiKey').value.trim();
  if (!API_KEY) { alert('Ingresá tu API key'); return; }
  const api = getApiChoice();
  log(`Descubriendo ligas via ${api}...`);
  discoveredLeagues = [];

  if (api === 'transfermarkt') {
    await discoverTM();
  } else {
    await discoverFS();
  }

  log(`\nTotal: ${discoveredLeagues.length} ligas encontradas`);

  const panel = document.getElementById('leaguePanel');
  panel.style.display = 'block';
  const checksDiv = document.getElementById('leagueChecks');
  checksDiv.innerHTML = discoveredLeagues.map((lg, i) =>
    `<label><input type="checkbox" value="${i}" ${i < 40 ? 'checked' : ''}> ${lg.country} - ${lg.name}</label>`
  ).join('');

function getLeagueTier(name, country) {
  const n = name.toLowerCase();
  const c = (country||'').toLowerCase();

  // ═══ DESCALIFICADORES DUROS ═══
  // Van antes que las reglas por país porque ninguna primera ni segunda división
  // masculina de mayores se llama así. Sin esto, "Saudi Womens Premier League"
  // matcheaba la regla de Arabia y entraba como Div 1 (y lo mismo pasaba con las
  // femeninas de Argentina, México, Turquía...).
  // Ojo: acá NO va 'league 2' — la Super League 2 griega es una segunda de verdad.
  const hardBlacklist = [
    'women','femen','feminin','féminin','damen','vrouwen',
    'youth','juvenil','juniores','sub-','sub ','u17','u18','u19','u20','u21','u23',
    'reserve','reserva','riserv','academy','primavera',
    'cup','copa','pokal','coupe','coppa','taca','taça',
    'futsal','beach','playa','friendly','amistoso'
  ];
  if (hardBlacklist.some(b => n.includes(b))) return 0;

  // ═══ REGLAS POR PAÍS (corren ANTES de la blacklist): sponsors y nombres locales ═══
  if (c.includes('argentin')) {
    if (/(betano|binance|liga profesional|torneo apertura|torneo clausura|torneo de la liga|superliga|primera divisi)/.test(n)) return 1;
    if (/(primera nacional|nacional b)/.test(n)) return 2;
  }
  if (c.includes('brazil') || c.includes('brasil')) {
    if (/s[ée]rie a/.test(n)) return 1;
    if (/s[ée]rie b/.test(n)) return 2;
  }
  if (c.includes('mexic')) {
    if (/(liga mx|apertura|clausura)/.test(n) && !/expansi/.test(n)) return 1;
    if (/expansi/.test(n)) return 2;
  }
  if (c.includes('urugua') || c.includes('paragua')) {
    if (/(apertura|clausura|primera divisi)/.test(n) && !/(intermedia|segunda)/.test(n)) return 1;
  }
  if (c.includes('italy')) {
    if (/serie a/.test(n)) return 1;
    if (/serie b/.test(n)) return 2;
  }
  if (c.includes('turkey') || c.includes('türkiye') || c.includes('turkiye')) {
    if (/s[uü]per ?lig/.test(n)) return 1;
    if (/1\.? ?lig/.test(n)) return 2;
  }
  if (c.includes('greece') || c.includes('grecia') || c.includes('hellas')) {
    if (/(super ?league ?2|football league|beta ethniki)/.test(n)) return 2;
    if (/(super ?league|stoiximan|alpha ethniki)/.test(n)) return 1;
  }
  if (c.includes('bolivia')) {
    if (/(divisi[oó]n profesional|liga.*profesional|primera divisi)/.test(n)) return 1;
  }
  if (c.includes('russia')) {
    if (/premier|premjer/.test(n)) return 1;
    if (/(fnl|first league|pervaja|1 division)/.test(n)) return 2;
  }
  if (c.includes('saudi') || c.includes('arabia')) {
    // Ojo: la segunda va PRIMERO. "Saudi First Division League" tiene "first",
    // y el patrón genérico de más abajo la marcaría como primera división.
    if (/(first division|1st division|division one|yelo)/.test(n)) return 2;
    if (/(pro league|professional league|roshn|saudi league|premier league|dawri)/.test(n)) return 1;
  }

  // Blacklist: cups, youth, women, reserves, amateur, regional, etc.
  const blacklist = [
    'cup','copa','pokal','coupe','coppa','taca','taça',
    'women','femen','feminin','féminin','damen','vrouwen',
    'youth','juvenil','juniores','junior','sub-','sub ','u17','u18','u19','u20','u21','u23',
    'reserve','reserva','riserv',
    'super cup','supercopa','supercoupe','supercoppa',
    'tercera','terza','3.liga','3rd','third','dritte','derde',
    'cuarta','quarta','4th','fourth','vierte','vierde',
    'regional','provincial','amateur','amateure',
    'friendly','amistoso',
    'qualification','qualifikation','playoff','play-off',
    'shield','trophée','trophy','community',
    'primavera','academy','formación',
    'futsal','beach','playa',
    'segunda b','ligue nationale','national 2','national 3',
    'serie c','serie d','league one','league two',
    'league 1','league 2', // English lower divisions
    '3. lig','bal ligi', // Turkish lower
    'eerste divisie amateur',
    'regionalliga','oberliga',
    'campeonato de portugal' // Portuguese 3rd tier
  ];
  if (blacklist.some(b => n.includes(b))) return 0;



  // Known first divisions (tier 1)
  const tier1 = [
    'liga profesional','superliga argentina','primera división argentina',
    'série a','brasileirão','campeonato brasileiro série a',
    'primera división chile','campeonato nacional chile',
    'primera división paraguay','división de honor',
    'primera división uruguay','campeonato uruguayo',
    'liga betplay','categoría primera a','liga dimayor',
    'liga 1 perú','liga 1','primera división perú',
    'ligapro serie a','ligapro','primera a ecuador',
    'primera división venezuela','liga futve',
    'primera división bolivia','liga profesional bolivia',
    'liga mx','primera división mexico',
    'major league soccer','mls',
    'premier league','english premier',
    'laliga','la liga','primera división españa','liga santander',
    'ligue 1','division 1 france','ligue 1 mcdonald',
    'bundesliga','1.bundesliga','1. bundesliga',
    'serie a italy','serie a tim','serie a italia',
    'eredivisie',
    'premier liga','russian premier','premjer-liga',
    'jupiler pro league','first division a belgium','pro league',
    'liga portugal','primeira liga','liga nos',
    'süper lig','super lig turkey'
  ];
  // OJO: la segunda se chequea ANTES que la primera. Las dos listas matchean
  // por substring y casi todas las segundas contienen el nombre de su primera:
  // "2. Bundesliga" contiene "bundesliga", "LaLiga 2" contiene "laliga",
  // "Liga Portugal 2" contiene "liga portugal", "Challenger Pro League"
  // contiene "pro league" y "LigaPro Serie B" contiene "ligapro". Con el orden
  // viejo las cinco entraban como primera división.
  // Al revés no pasa: ningún nombre de primera contiene el de una segunda.

  // Known second divisions (tier 2)
  const tier2 = [
    'primera nacional','primera b nacional','segunda división argentina',
    'série b','brasileirão série b','campeonato brasileiro série b',
    'primera b chile','segunda división chile',
    'división intermedia','segunda división paraguay',
    'segunda división uruguay',
    'torneo betplay','categoría primera b colombia',
    'liga 2 perú','liga 2','segunda división perú',
    'ligapro serie b','primera b ecuador',
    'segunda división venezuela',
    'segunda división bolivia',
    'liga de expansión','liga de expansión mx',
    'usl championship',
    'championship','efl championship','english championship',
    'laliga 2','la liga 2','segunda división españa','laliga hypermotion',
    'ligue 2','division 2 france',
    '2.bundesliga','2. bundesliga','zweite bundesliga',
    'serie b italy','serie b italia','serie bkt',
    'eerste divisie',
    'fnl','first division russia','pervaja liga',
    'challenger pro league','first division b belgium',
    'liga portugal 2','segunda liga','liga sabseg',
    '1. lig','tff 1. lig','first league turkey'
  ];
  if (tier2.some(t => n.includes(t) || n === t)) return 2;
  if (tier1.some(t => n.includes(t) || n === t)) return 1;

  // Generic pattern matching for "primera" / "first" / "1st" → tier 1
  if (/\b(primera|first|1st|1a|1ère)\b/.test(n) && !/\b(b|nacional)\b/.test(n)) return 1;
  // Generic for "segunda" / "second" / "2nd" → tier 2
  if (/\b(segunda|second|2nd|2a|2ème)\b/.test(n)) return 2;

  return 0;
}

// Mapa id→nombre de país (para resolver nacionalidades que vienen como bandera/ID)
window._tmCountries = window._tmCountries || {};
function storeCountries(list){
  (list||[]).forEach(c=>{
    const id=c.id||c.ID, nm=c.name||c.NAME;
    if(id!==undefined&&nm) window._tmCountries[String(id)]=nm;
  });
}
// Busca la nacionalidad en CUALQUIER campo del jugador: nombre, ID de país o URL de bandera
function resolveNat(p){
  // 1) Campos con ID numérico de país
  for(const k of Object.keys(p)){
    const lk=k.toLowerCase();
    if(/(countr|nation|citizen)/.test(lk)){
      const v=p[k];
      if(typeof v==='number'&&window._tmCountries[String(v)]) return window._tmCountries[String(v)];
      if(typeof v==='string'&&/^\d+$/.test(v)&&window._tmCountries[v]) return window._tmCountries[v];
      if(v&&typeof v==='object'&&v.id!==undefined&&window._tmCountries[String(v.id)]) return window._tmCountries[String(v.id)];
    }
  }
  // 2) URLs de bandera tipo .../flagge/.../123.png (el número es el ID de país de TM)
  for(const k of Object.keys(p)){
    const v=p[k];
    if(typeof v==='string'&&/flagge|flag/i.test(v)){
      const m=v.match(/(\d+)\.(png|jpg|gif|svg)/);
      if(m&&window._tmCountries[m[1]]) return window._tmCountries[m[1]];
    }
    if(Array.isArray(v)){
      for(const it of v){
        if(typeof it==='string'&&/flagge|flag/i.test(it)){
          const m=it.match(/(\d+)\.(png|jpg|gif|svg)/);
          if(m&&window._tmCountries[m[1]]) return window._tmCountries[m[1]];
        }
        if(it&&typeof it==='object'&&it.id!==undefined&&window._tmCountries[String(it.id)]) return window._tmCountries[String(it.id)];
      }
    }
  }
  return '';
}

async function discoverTM() {
  const countries = await apiGet('/countries', 'transfermarkt');
  if (!countries) { log('No se pudieron obtener países'); return; }
  storeCountries(Array.isArray(countries)?countries:Object.values(countries).find(v=>Array.isArray(v))||[]);

  // countries could be array or object
  let countryList = Array.isArray(countries) ? countries : [];
  if (!countryList.length && typeof countries === 'object') {
    for (const v of Object.values(countries)) {
      if (Array.isArray(v)) { countryList = v; break; }

  }

  log(`${countryList.length} países disponibles`);

  for (const country of countryList) {

    const isTarget = Object.keys(TARGET_COUNTRIES_TM).some(t =>
      cName.toLowerCase().includes(t.toLowerCase())
    );

    log(`Buscando ligas de ${cName} (id: ${cId})...`);

        if (Array.isArray(v)) { compList = v; break; }

    }

    if (compList.length === 0 && typeof comps === 'object') {
      // Maybe single competition or nested
      log('  Estructura: ' + JSON.stringify(Object.keys(comps)));
      log('  Data: ' + JSON.stringify(comps).slice(0, 500));
    }

    let kept = 0;
    for (const comp of compList) {
      const lName = comp.name || comp.NAME || comp.title || '';
      const lId = comp.id || comp.ID || '';
      if (!lName) continue;

      }

}

// ═══ DE UNA LIGA A SU LISTA DE CLUBES ═══
// Estaba embebido dentro de extractTM, así que para sacar los DTs había que
// bajar TODOS los planteles. Acá afuera lo puede usar también el modo
// "sólo DTs", que no toca los planteles.
async function clubsDeLiga(lg, li) {
    // Step 1: Get competition details (has seasons array)
    const comp = await apiGet(`/competitions/${lg.id}`, 'transfermarkt');
    if (!comp) { log('  ✗ No se pudo obtener la competición'); return []; }

    if (li < 3) {
      log('  Competición keys: ' + JSON.stringify(Object.keys(comp)));
    }

    // Step 2: Find the latest season
    let seasons = [];
    if (comp.seasons && Array.isArray(comp.seasons)) {
      seasons = comp.seasons;
    } else if (Array.isArray(comp)) {
      seasons = comp;
    } else if (typeof comp === 'object') {
      for (const v of Object.values(comp)) {
        if (Array.isArray(v) && v.length > 0 && v[0].id) { seasons = v; break; }
      }
    }

    if (li < 3) {
      log('  Temporadas: ' + seasons.length);
      if (seasons.length > 0) log('  Última: ' + JSON.stringify(seasons[0]).slice(0, 300));
    }

    // Pick the latest season (usually first in array, or highest id)
    let currentSeason = seasons[0];
    if (!currentSeason) {
      log('  ✗ Sin temporadas, probando standings directo...');
      // Try direct standings
      const directStandings = await apiGet(`/competitions/${lg.id}/standings`, 'transfermarkt');
      if (directStandings) {
        currentSeason = { standingsUrl: `/competitions/${lg.id}/standings` };
      } else {
        return [];
      }
    }

    // Step 3: Get standings to find actual clubs
    let standingsPath = '';
    if (currentSeason.standings) {
      standingsPath = currentSeason.standings.replace('/api/transfermarkt', '');
    } else if (currentSeason.standingsUrl) {
      standingsPath = currentSeason.standingsUrl;
    } else if (currentSeason.id) {
      standingsPath = `/competitions/${lg.id}/${currentSeason.id}/standings`;
    }

    log(`  Buscando standings: ${standingsPath}`);
    let standingsData = null;
    if (standingsPath) {
      standingsData = await apiGet(standingsPath, 'transfermarkt');
    }

    if (!standingsData) {
      // Try alternate paths
      const altPaths = [
        `/competitions/${lg.id}/2025/standings`,
        `/competitions/${lg.id}/2024/standings`,
        `/competitions/${lg.id}/standings`
      ];
      for (const ap of altPaths) {
        standingsData = await apiGet(ap, 'transfermarkt');
        if (standingsData) { log(`  ✓ Standings via ${ap}`); break; }
      }
    }

    if (!standingsData) { log('  ✗ Sin standings'); return []; }

    if (li < 3) {
      log('  Standings keys: ' + JSON.stringify(Object.keys(standingsData)));
      log('  Standings: ' + JSON.stringify(standingsData).slice(0, 800));
    }

    // Step 4: Extract clubs from standings
    let clubs = [];
    if (Array.isArray(standingsData)) {
      clubs = standingsData;
    } else if (typeof standingsData === 'object') {
      for (const key of ['table','clubs','teams','standings','data','rows','group']) {
        if (standingsData[key]) {
          const val = standingsData[key];
          if (Array.isArray(val)) { clubs = val; break; }
          // Could be groups: {A: [...], B: [...]}
          if (typeof val === 'object') {
            for (const gv of Object.values(val)) {
              if (Array.isArray(gv)) clubs.push(...gv);
            }
            if (clubs.length > 0) break;
          }
        }
      }
      if (clubs.length === 0) {
        for (const v of Object.values(standingsData)) {
          if (Array.isArray(v) && v.length > 2) { clubs = v; break; }
        }
      }
    }

    if (li < 3 && clubs.length > 0) {
      log('  Club real ejemplo: ' + JSON.stringify(clubs[0]).slice(0, 600));
      log('  Club keys: ' + JSON.stringify(Object.keys(clubs[0])));
    }

    return clubs;
}

// ═══ SÓLO DTs ═══
// El DT se bajaba dentro del bucle que recorre club por club trayendo el
// plantel completo: para actualizar los técnicos había que volver a bajar
// todos los jugadores (y pagar los créditos que eso cuesta). Este modo llega
// a la lista de clubes por el mismo camino (competición → temporada →
// standings, que es gratis y son pocos pedidos) y de ahí hace UNA consulta
// por club a tmcoach. Ni un plantel de por medio.
async function extractDTsOnly(selected) {
  allCoaches = [];
  let clubesVistos = 0;
  for (let li = 0; li < selected.length; li++) {
    const lg = selected[li];
    setProgress((li / selected.length) * 95);
    log(`\n[${li+1}/${selected.length}] ${lg.country} - ${lg.name} (${lg.id})...`);
    const clubs = await clubsDeLiga(lg, li);
    if (!clubs.length) continue;
    log(`  ${clubs.length} clubes — buscando sus DTs`);
    for (let ci = 0; ci < clubs.length; ci++) {
      const club = clubs[ci];
      const clubName = String(club.name || club.clubName || club.club || club.teamName || '');
      const clubId = club.id || club.clubId || club.ID || '';
      if (!clubId) continue;
      clubesVistos++;
      const dtRes = await apiGet(`/verein/${clubId}`, 'tmcoach');
      if (dtRes && dtRes.coach && dtRes.coach.name) {
        allCoaches.push({ name: dtRes.coach.name, club: clubName, league: lg.name, country: lg.country });
        log(`  🎩 ${clubName}: ${dtRes.coach.name}`);
      } else {
        log(`  — ${clubName}: sin DT`);
      }
    }
  }
  setProgress(100);
  log(`\n=== ${allCoaches.length} DTs de ${clubesVistos} clubes ===`);
  if (!allCoaches.length) {
    log('Ningún DT. Si el log dice ERROR 400 en /verein/..., tu proxy no soporta tmcoach.');
    return;
  }
  log('Listo. Apretá "Descargar DTs (dts-db.js)" — respeta las edades y');
  log('nacionalidades que ya tengas curadas a mano en dts-db.js.');
}

// TransferMarkt extraction: /competitions/{id} → seasons → standings → clubs → /clubs/{id}/players
async function extractTM(selected) {
  let totalTeams = 0, totalPlayers = 0;
  if(!Object.keys(window._tmCountries||{}).length){
    const cs=await apiGet('/countries','transfermarkt');
    if(cs)storeCountries(Array.isArray(cs)?cs:Object.values(cs).find(v=>Array.isArray(v))||[]);
    log('Mapa de países: '+Object.keys(window._tmCountries).length+' cargados');
  }
  const wantNats = (document.getElementById('fillNats')||{}).checked;
  const wantDTs = (document.getElementById('extractDTs')||{}).checked;
  allCoaches = [];

  for (let li = 0; li < selected.length; li++) {
    const lg = selected[li];
    setProgress((li / selected.length) * 95);
    log(`\n[${li+1}/${selected.length}] ${lg.country} - ${lg.name} (${lg.id})...`);

    const clubs = await clubsDeLiga(lg, li);
    if (!clubs.length) continue;
    log(`  ${clubs.length} clubs reales encontrados`);
    totalTeams += clubs.length;

    // Step 5: For each club, get /clubs/{id}/players
    for (let ci = 0; ci < clubs.length; ci++) {
      const club = clubs[ci];
      const clubName = String(club.name || club.clubName || club.club || club.teamName || '');
      const clubId = club.id || club.clubId || club.ID || '';

      if (!clubId) continue;
      log(`  [${ci+1}/${clubs.length}] ${clubName} (${clubId})...`);

      const playersData = await apiGet(`/clubs/${clubId}/players`, 'transfermarkt');
      if (!playersData) { log(`    ✗ Sin datos`); continue; }

      // NACIONALIDADES: SportDB las devuelve vacías, pero la TM-API libre
      // (transfermarkt-api.fly.dev, gratis vía Worker api=tmapi) sí las trae.
      // Armamos un mapa nombre→nacionalidad y lo usamos al parsear.
      let natByName = {}, nat2ByName = {};
      if (wantNats) {
        // 1) Intento gratis: la TM-API libre (si está viva)
        const free = await apiGet(`/clubs/${clubId}/players`, 'tmapi');
        const list = free && Array.isArray(free.players) ? free.players : [];
        for (const fp of list) {
          const nm = String(fp.name || '').toLowerCase();
          let nn = fp.nationality;
          if (Array.isArray(nn)) nn = nn[0] || '';
          if (nm && nn) natByName[nm] = String(nn);
        }
        if (!list.length && ci === 0 && li === 0) {
          // Sólo prometemos lo que realmente vamos a hacer
          log(document.getElementById('deepNats').checked
            ? '    (TM-API libre caída → uso los perfiles de SportDB, 1 crédito por jugador)'
            : '    ⚠️ TM-API libre caída y el checkbox de perfiles NO está tildado:\n       las nacionalidades van a salir en UNK. Tildá "Nacionalidades desde el perfil".');
        }

        // (el respaldo por perfiles corre más abajo, cuando playerList ya existe)
      }

      // DT: la web de Transfermarkt muestra al entrenador en la página del
      // club — el Worker (api=tmcoach) la baja y lo extrae. Gratis.
      if (wantDTs) {
        const dtRes = await apiGet(`/verein/${clubId}`, 'tmcoach');
        if (dtRes && dtRes.coach && dtRes.coach.name) {
          allCoaches.push({ name: dtRes.coach.name, club: clubName, league: lg.name, country: lg.country });
          log(`    🎩 DT: ${dtRes.coach.name}`);
        } else if (ci === 0 && li === 0) {
          log('    (sin DT: ¿Worker actualizado? ¿TM bloqueó el fetch?)');
        }
      }

      if (ci < 2 && li < 1) {
        log('    Players response keys: ' + JSON.stringify(Object.keys(playersData)));
        log('    Data: ' + JSON.stringify(playersData).slice(0, 600));
      }

      let playerList = [];
      if (Array.isArray(playersData)) {
        playerList = playersData;
      } else if (typeof playersData === 'object') {
        // Could have nested groups like {goalkeepers: [...], defenders: [...], ...}
        for (const [k, v] of Object.entries(playersData)) {
          if (Array.isArray(v) && v.length > 0) {
            playerList.push(...v);
          }
        }
      }

      // ═══ RESPALDO DE NACIONALIDADES POR PERFIL ═══
      // Va acá y no arriba: necesita playerList ya construido. Estaba antes de
      // su declaración y lanzaba un ReferenceError que cortaba todo el bucle.
      if (wantNats && !Object.keys(natByName).length && document.getElementById('deepNats').checked) {
        const ids = playerList.map(x => x.id || x.playerId).filter(Boolean);
        for (const pid of ids) {
          const prof = await apiGet(`/players/${pid}/profile`, 'transfermarkt');
          const nn = natFromProfile(prof);
          const n2 = nat2FromProfile(prof);
          if (nn && prof && prof.name) {
            const k = String(prof.name).toLowerCase();
            natByName[k] = nn;
            if (n2) nat2ByName[k] = n2;
          }
        }
        if (ci === 0 && li === 0) {
          const ej = Object.entries(natByName)[0];
          log('    Perfiles SportDB: ' + Object.keys(natByName).length + ' nacionalidades' + (ej ? ` (ej: ${ej[0]} → ${ej[1]})` : ''));
        }
      }

      if (ci < 2 && li < 1 && playerList.length > 0) {
        log('    Jugador ejemplo COMPLETO: ' + JSON.stringify(playerList[0]));
        log('    Jugador keys: ' + JSON.stringify(Object.keys(playerList[0])));
      }

      let added = 0;
      for (const p of playerList) {
        const name = String(p.name || p.playerName || p.fullName || '');
        if (!name || name === 'undefined' || name === 'null' || /^\d+$/.test(name)) continue;

        let natRaw = p.nationality || p.nationalities || p.citizenship || p.citizenships || p.nationalityName || p.birthCountry || p.country || '';
        if (!natRaw || (Array.isArray(natRaw)&&!natRaw.length)) natRaw = natByName[name.toLowerCase()] || '';
        if (!natRaw) natRaw = resolveNat(p);
        let footRaw = p.foot || p.preferredFoot || p.strongFoot || '';
        if (typeof footRaw === 'object') footRaw = footRaw.name || '';
        if (Array.isArray(natRaw)) natRaw = natRaw[0] || '';
        const nat = typeof natRaw === 'object' ? (natRaw.name || natRaw.code || JSON.stringify(natRaw)) : String(natRaw);
        const posRaw = p.position || p.mainPosition || p.pos || '';
        const pos = typeof posRaw === 'object' ? (posRaw.name || posRaw.main || JSON.stringify(posRaw)) : String(posRaw);

        allPlayers.push({
          name,
          age: parseInt(p.age) || 0,
          nat,
          pos,
          club: clubName || String(clubId),
          league: lg.name,
          country: lg.country,
          goals: parseInt(p.goals) || 0,
          assists: parseInt(p.assists) || 0,
          apps: parseInt(p.appearances || p.matches) || 0,
          marketVal: parseMarketVal(p.marketValue || p.value || p.currentMarketValue || ''),
          number: parseInt(p.shirtNumber || p.number || p.jerseyNumber) || 0,
          // ═══ VENCIMIENTO DE CONTRATO ═══
          // El juego lo necesita de verdad: define si un jugador se abarata,
          // si se le puede firmar un precontrato o si queda libre. Hasta ahora
          // se inventaba al azar.
          contractUntil: parseContractYear(p.contract || p.contractUntil || p.contractExpiryDate || p.contractExpires || ''),
          // Altura: sirve para el juego aéreo (cabezazos, córners)
          heightCm: parseHeight(p.height || p.heightCm || ''),
          // Segunda posición: el juego penaliza jugar fuera de puesto, así que
          // saber que un DFC también juega de MCD cambia el armado del equipo.
          pos2: pickSecondPos(p),
          // Segunda nacionalidad: define si ocupa cupo de extranjero
          nat2: nat2ByName[name.toLowerCase()] || '',
          // Cláusula de rescisión real (el juego ya sabe comprarlas por cláusula)
          clauseM: parseMarketVal(p.releaseClause || p.clause || p.buyoutClause || ''),
          foot: String(footRaw||'').toLowerCase().includes('izq')||String(footRaw||'').toLowerCase().includes('left')?'izq':String(footRaw||'').toLowerCase().includes('der')||String(footRaw||'').toLowerCase().includes('right')?'der':String(footRaw||'').toLowerCase().includes('both')||String(footRaw||'').toLowerCase().includes('ambi')?'ambi':'',
          playerId: p.id || p.playerId || ''
        });
        added++;
        totalPlayers++;
      }
      log(`    ✓ ${added} jugadores`);
      updateStats(li + 1, totalTeams, totalPlayers);
    }
  }
}

// Flashscore extraction: /team/{slug}/{id} includes squad
async function extractFS(selected) {
  let totalTeams = 0, totalPlayers = 0;

  for (let li = 0; li < selected.length; li++) {
    const lg = selected[li];
    const raw = lg.raw || {};
    setProgress((li / selected.length) * 95);
    log(`\n[${li+1}/${selected.length}] ${lg.country} - ${lg.name}...`);

    // Get teams from league standings
    let paths = [];
    for (const [k, v] of Object.entries(raw)) {
      if (typeof v === 'string' && v.includes('/football/')) {
        paths.push(v.replace('/api/flashscore', ''));
      }
    }
    const cs = lg.countrySlug || lg.country.toLowerCase().replace(/\s+/g, '-');
    const ls = lg.slug || lg.name.toLowerCase().replace(/\s+/g, '-');
    paths.push(`/football/${cs}/${ls}/standings`);
    paths.push(`/football/${cs}/${ls}`);

    let leagueData = null;
    for (const p of paths) {
      leagueData = await apiGet(p, 'flashscore');
      if (leagueData) break;
    }
    if (!leagueData) { log('  ✗ Sin datos de liga'); continue; }

    // Find teams array
    let teams = [];
    if (Array.isArray(leagueData)) {
      teams = leagueData;
    } else if (typeof leagueData === 'object') {
      for (const v of Object.values(leagueData)) {
        if (Array.isArray(v) && v.length > 2) { teams = v; break; }
      }
    }

    log(`  ${teams.length} equipos`);
    totalTeams += teams.length;

    for (let ti = 0; ti < teams.length; ti++) {
      const team = teams[ti];
      const teamName = team.name || '';
      const teamId = team.id || '';
      const teamSlug = team.slug || teamName.toLowerCase().replace(/[^a-z0-9]+/g, '-');

      if (!teamId) continue;
      log(`  [${ti+1}/${teams.length}] ${teamName}...`);

      // Flashscore team endpoint: /team/{slug}/{id}
      const teamData = await apiGet(`/team/${teamSlug}/${teamId}`, 'flashscore');
      if (!teamData) { log(`    ✗ Sin datos`); continue; }

      if (ti < 2 && li < 2) {
        log('    Team keys: ' + JSON.stringify(Object.keys(teamData)));
        log('    Data: ' + JSON.stringify(teamData).slice(0, 800));
      }

      // Find squad/players in team data
      let squad = [];
      if (typeof teamData === 'object') {
        for (const key of ['squad','players','roster','data']) {
          if (teamData[key] && Array.isArray(teamData[key])) { squad = teamData[key]; break; }
          if (teamData[key] && typeof teamData[key] === 'object') {
            for (const v of Object.values(teamData[key])) {
              if (Array.isArray(v)) { squad.push(...v); }
            }
            if (squad.length > 0) break;
          }
        }
      }

      if (ti < 2 && li < 2 && squad.length > 0) {
        log('    Jugador ejemplo: ' + JSON.stringify(squad[0]).slice(0, 500));
      }

      let added = 0;
      for (const p of squad) {
        const name = p.name || p.playerName || '';
        if (!name) continue;
        const lower = name.toLowerCase();
        const badWords = ['play off','stage','final','relegation','promotion','apertura','clausura','copa','round','group'];
        if (badWords.some(w => lower.includes(w))) continue;

        allPlayers.push({
          name,
          age: p.age || 0,
          nat: p.nationality || p.country || p.flag || '',
          pos: p.position || p.pos || '',
          club: teamName,
          league: lg.name,
          country: lg.country,
          goals: p.goals || 0,
          assists: p.assists || 0,
          apps: p.appearances || p.matches || 0,
          marketVal: parseMarketVal(p.marketValue || p.value || ''),
          number: p.number || p.shirt || 0
        });
        added++;
        totalPlayers++;
      }
      log(`    ✓ ${added} jugadores`);
      updateStats(li + 1, totalTeams, totalPlayers);
    }
  }
}

// Parse market value strings like "€25.00m", "€500k", or numeric values
function parseMarketVal(val) {
  if (!val) return 0;
  // Números crudos en euros (>= 1000) → millones; menores se asumen ya en millones
  if (typeof val === 'number') return val >= 1000 ? Math.round(val / 1000) / 1000 : val;
  const s = String(val).toLowerCase().replace(/[€$£,\s]/g, '');
  let num = parseFloat(s);
  if (isNaN(num)) return 0;
  if (s.includes('m') || s.includes('mil')) return num;
  if (s.includes('k') || s.includes('thou')) return num / 1000;
  if (num >= 1000) return Math.round(num / 1000) / 1000;
  return num;
}

// ========== OUTPUT GENERATION ==========
function mapPos(pos) {
  const p = (pos || '').toLowerCase();
  if (p.includes('goalkeeper') || p.includes('keeper') || p === 'gk' || p.includes('torwart')) return 'ARQ';
  if (p.includes('centre-back') || p.includes('center-back') || p.includes('central defender') || p === 'cb' || p.includes('innenverteidiger')) return 'DFC';
  if (p.includes('left-back') || p.includes('left back') || p === 'lb' || p.includes('linker verteidiger')) return 'DFI';
  if (p.includes('right-back') || p.includes('right back') || p === 'rb' || p.includes('rechter verteidiger')) return 'DFD';
  if (p.includes('defensive mid') || p === 'cdm' || p === 'dm' || p.includes('defensives mittelfeld')) return 'MCD';
  if (p.includes('defen')) return 'DFC';
  if (p.includes('central mid') || p === 'cm' || p.includes('zentrales mittelfeld')) return 'MC';
  if (p.includes('attacking mid') || p === 'cam' || p === 'am' || p.includes('offensives mittelfeld')) return 'MCO';
  if (p.includes('left mid') || p.includes('left wing') || p === 'lw' || p === 'lm' || p.includes('linksaussen') || p.includes('left forward')) return 'EI';
  if (p.includes('right mid') || p.includes('right wing') || p === 'rw' || p === 'rm' || p.includes('rechtsaussen') || p.includes('right forward')) return 'ED';
  if (p.includes('midfield')) return 'MC';
  if (p.includes('second striker') || p.includes('hangende spitze')) return 'MCO';
  if (p.includes('centre-forward') || p.includes('center-forward') || p.includes('striker') || p === 'cf' || p === 'st' || p.includes('mittelstürmer')) return 'DC';
  if (p.includes('forward') || p.includes('attack')) return 'DC';
  if (p.includes('winger')) return 'ED';
  return 'MC';
}

// ═══ DIAGNÓSTICO: ¿funcionan las dos fuentes libres? ═══
// Las nacionalidades y los DTs NO vienen de SportDB: salen de dos fuentes
// gratuitas aparte. Si el proxy que estás usando no las conoce, devuelve 400
// y termina con todas las nacionalidades en 'UNK' y sin ningún DT — que es
// exactamente lo que pasaba. Este botón te dice cuál de las dos falla.
// Pide una URL cruda y devuelve status + cuerpo, sin interpretar nada.
// Sirve para ver EXACTAMENTE qué contesta cada fuente cuando algo falla.
async function rawGet(apiType, path) {
  const url = '/.netlify/functions/sportdb?api=' + apiType +
    '&key=' + encodeURIComponent(API_KEY) + '&path=' + encodeURIComponent(path);
  try {
    const r = await fetch(url);
    const t = await r.text();
    return { status: r.status, body: t.slice(0, 400) };
  } catch (e) { return { status: 0, body: 'FETCH ERROR: ' + e.message }; }
}

// ═══ SONDA: prueba varias formas de endpoint hasta encontrar una que sirva ═══
// ¿La respuesta trae una nacionalidad CON DATOS? (no alcanza con que exista el
// campo: SportDB devuelve "nationality":[] vacío en el listado del plantel)
function hasRealNat(body) {
  const m = body.match(/"(?:nationality|nationalities|citizenship|country)"\s*:\s*(\[[^\]]*\]|"[^"]*")/i);
  if (m) { const v = m[1]; if (v !== '[]' && v !== '""' && v !== '[""]' && v.length > 3) return true; }
  return /,\s*from\s+[A-ZÁÉÍÓÚÑ]/.test(body);   // viene dentro de "description"
}

// ═══ NACIONALIDAD DESDE EL PERFIL DEL JUGADOR ═══
// El listado del plantel devuelve "nationality":[] vacío, pero el endpoint
// /players/{id}/profile SÍ la trae, embebida en la descripción:
//   "Álvaro Montero, 31, from Colombia ➤ CA Boca Juniors, since 2026 ➤ ..."
// De paso salen el lugar de nacimiento y la fecha, que sirven de respaldo.
function natFromProfile(prof) {
  if (!prof) return '';
  // 1) Campo propio si algún día lo llenan
  let n = prof.nationality || prof.citizenship || prof.country || '';
  if (Array.isArray(n)) n = n[0] || '';
  if (n && String(n).trim()) return String(n).trim();
  // 2) De la descripción: "..., 31, from Colombia ➤ ..."
  const d = String(prof.description || '');
  let m = d.match(/,\s*\d{1,2},\s*from\s+([^➤|]+?)\s*(?:➤|$)/i) || d.match(/\bfrom\s+([^➤|]+?)\s*(?:➤|$)/i);
  if (m) return m[1].trim();
  // 3) Último recurso: el país del lugar de nacimiento ("* 29/03/1995 in El Molino, Colombia")
  m = d.match(/\bin\s+[^,➤]+,\s*([^➤|]+?)\s*(?:➤|$)/i);
  if (m) return m[1].trim();
  return '';
}

// ═══ SEGUNDA NACIONALIDAD ═══
// En el fútbol argentino, un extranjero nacionalizado NO ocupa cupo. Si el
// jugador tiene doble ciudadanía hay que saberlo, o contamos mal el cupo.
function nat2FromProfile(prof) {
  if (!prof) return '';
  let arr = prof.nationalities || prof.citizenship || prof.nationality;
  if (Array.isArray(arr) && arr.length > 1) {
    const b = arr[1];
    return String((b && (b.name || b.country)) || b || '').trim();
  }
  // La descripción a veces lista las dos: "from Brazil Italy ➤"
  const d = String(prof.description || '');
  const m = d.match(/\bfrom\s+([A-ZÁÉÍÓÚÑ][^➤|,]*?)\s+([A-ZÁÉÍÓÚÑ][a-záéíóúñ]+(?:\s+[A-ZÁÉÍÓÚÑ][a-záéíóúñ]+)?)\s*(?:➤|$)/);
  if (m) return m[2].trim();
  return '';
}

// Segunda posición. Transfermarkt la publica como "otherPosition" / lista de
// posiciones; agarramos la primera que sea distinta de la principal.
function pickSecondPos(p) {
  const main = String(p.position || p.mainPosition || p.pos || '');
  let cands = p.otherPositions || p.secondaryPositions || p.otherPosition || p.positions || [];
  if (!Array.isArray(cands)) cands = [cands];
  for (let c of cands) {
    if (c && typeof c === 'object') c = c.name || c.position || '';
    c = String(c || '').trim();
    if (c && c.toLowerCase() !== main.toLowerCase()) return c;
  }
  return '';
}
// Año de vencimiento del contrato. Transfermarkt lo manda en varios formatos
// ("Jun 30, 2027", "2027-06-30", "30.06.2027"): sacamos el año.
function parseContractYear(v) {
  if (!v) return 0;
  if (typeof v === 'object') v = v.until || v.date || v.expires || '';
  const s = String(v);
  const m = s.match(/(20\d{2})/);
  return m ? parseInt(m[1]) : 0;
}
// Altura en cm ("1,85 m" / "185 cm" / 185)
function parseHeight(v) {
  if (!v) return 0;
  const s = String(v).replace(',', '.');
  const m = s.match(/(\d+\.?\d*)/);
  if (!m) return 0;
  const n = parseFloat(m[1]);
  return n < 3 ? Math.round(n * 100) : Math.round(n);
}

      const hCm = p.heightCm || 0;
      const p2 = p.pos2 ? mapPos(p.pos2) : '';
      const nat2 = p.nat2 ? mapNat(p.nat2) : '';
      const cl = p.clauseM || 0;
      const gl = p.goals || 0, as = p.assists || 0, ap = p.apps || 0;
      js += `[${num},'${pName.replace(/'/g,"\\'")}','${pos}',${p.age||25},'${nat}','${pClub.replace(/'/g,"\\'")}','${lg}',${val},'${foot}',${cUntil},${hCm},'${p2}',${cl},${gl},${as},${ap},'${nat2}'],\n`;
      csv += `"${pName}","${pos}",${p.age||''},"${nat}","${p.foot||''}","${pClub}","${lg}",${gl},${as},${ap},${val},${cUntil||''},${hCm||''},"${p2}",${cl||''},"${nat2}"\n`;
    }

    js += `  // Total: ${unique.length} jugadores extraidos\n`;
    const pct=(n)=>Math.round(n/unique.length*100);
    const cC = unique.filter(p=>p.contractUntil).length;
    const cH = unique.filter(p=>p.heightCm).length;
    const cP = unique.filter(p=>p.pos2).length;
    const cL = unique.filter(p=>p.clauseM).length;
    const cS = unique.filter(p=>p.apps).length;
    log(`Cobertura de datos: contrato ${cC} (${pct(cC)}%) · altura ${cH} (${pct(cH)}%) · 2ª posición ${cP} (${pct(cP)}%) · cláusula ${cL} (${pct(cL)}%) · estadísticas ${cS} (${pct(cS)}%)`);

    document.getElementById('output').value = js;
    window._csvData = csv;
    window._jsData = js;

    log(`Output generado: ${unique.length} jugadores únicos (de ${allPlayers.length} totales)`);
  } catch (e) {
    log('ERROR generando output: ' + e.message);
    document.getElementById('output').value = '// Error: ' + e.message;
  }
}

function copyOutput() {
  const el = document.getElementById('output');
  el.select();
  document.execCommand('copy');
  alert('Copiado al portapapeles');
}

function downloadOutput() {
  const blob = new Blob([window._jsData || document.getElementById('output').value], {type:'text/javascript'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'players_sportdb.js';
  a.click();
}

// Los DTs salen de la web de Transfermarkt vía el Worker (api=tmcoach).
// Se descargan en el formato de dts-db.js: [nombre, edad, nac, club, liga]
// (edad y nacionalidad no vienen de la página del club: el juego las
// completa solo; si querés precisión, editá el archivo a mano).
function downloadDTs() {
  if (!allCoaches.length) {
    const cfW = (document.getElementById('cfWorker')||{value:''}).value.trim();
    alert('No se extrajo ningún DT.\n\n' +
      'Los DTs NO vienen de SportDB: se leen de la web de Transfermarkt a través del proxy.\n' +
      'Si viste "ERROR 400 en /verein/..." en el log, el proxy no soporta api=tmcoach.\n\n' +
      'Proxy en uso: ' + (cfW ? 'Worker de Cloudflare' : 'Función de Netlify') + '\n\n' +
      'Solución:\n' +
      (cfW ? '• Actualizá el código del Worker con cloudflare-worker/sportdb-cache.js del repo.\n'
           : '• Hacé un redeploy en Netlify (la función sportdb.js se actualizó para soportar tmcoach).\n') +
      '• Después usá el botón "🩺 Probar nacionalidades y DTs" para confirmar antes de extraer todo.');
    return;
  }
  const seen = new Set();
  const rows = allCoaches.filter(c => {
    const k = c.name.toLowerCase() + '|' + c.club;
    if (seen.has(k)) return false; seen.add(k); return true;
  });
  // Si ya hay un dts-db.js curado a mano (con edades y nacionalidades reales),
  // se respetan esos datos y sólo se actualiza el club. Antes se pisaba todo
  // con edad 0 y nacionalidad vacía y se perdía el trabajo hecho a mano.
  const prev = {};
  (window.DTS_DB || []).forEach(r => { if (r && r[0]) prev[String(r[0]).toLowerCase()] = r; });
  let kept = 0;
  const out = rows.map(c => {
    const old = prev[c.name.toLowerCase()];
    const age = (old && old[1]) || c.age || 0;
    const nat = (old && old[2]) || c.nat || '';
    if (old && (old[1] || old[2])) kept++;
    return [c.name, age, nat, c.club, mapLeague(c.country, c.league)];
  });
  // Los curados que el scrape no encontró no se pierden
  const found = new Set(out.map(r => String(r[0]).toLowerCase()));
  let carried = 0;
  Object.values(prev).forEach(r => { if (!found.has(String(r[0]).toLowerCase())) { out.push(r); carried++; } });
  log(`DTs: ${rows.length} extraídos · ${kept} conservaron edad/nacionalidad curada · ${carried} curados sin scrape mantenidos · ${out.length} en total`);
  const js = '// DTs extraídos de la web de Transfermarkt — [nombre,edad,nac,club,liga]\nwindow.DTS_DB=[\n' +
    out.map(r => JSON.stringify(r)).join(',\n') + '\n];\n';
  const blob = new Blob([js], { type: 'text/javascript' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'dts-db.js';
  a.click();
}

function downloadCSV() {
  if (!window._csvData) { alert('Primero extraé los jugadores'); return; }
  const blob = new Blob([window._csvData], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'players_sportdb.csv';
  a.click();
}
</script>
